# Set each meter's RTC from the ESP32's SNTP clock (alfred, 10.0.32.1).
# The meters support only FC6 (write a SINGLE register), so this is three
# separate writes; the seconds field can therefore roll between them, which is
# fine for a clock that is only used to timestamp its own logs.
# Encoding per manual: 6 BCD bytes "SMHDMY, lower byte first" ->
#   reg52 = (minute<<8)|second   reg53 = (day<<8)|hour   reg54 = (month<<8)|year%100
button:
  - platform: template
    name: "tuf2_set_clock"
    id: tuf2_set_clock
    entity_category: config
    on_press:
      - lambda: |-
          auto t = id(sntp_time).now();
          if (!t.is_valid()) {
            ESP_LOGW("tuf", "SNTP time not valid yet -- refusing to set meter clock");
            return;
          }
          auto bcd = [](int v) -> uint16_t { return ((v / 10) << 4) | (v % 10); };
          uint16_t r52 = (bcd(t.minute) << 8) | bcd(t.second);
          uint16_t r53 = (bcd(t.day_of_month) << 8) | bcd(t.hour);
          uint16_t r54 = (bcd(t.month) << 8) | bcd(t.year % 100);
          ESP_LOGI("tuf", "setting tuf2 clock to %04d-%02d-%02d %02d:%02d:%02d",
                   t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          auto *c = id(tuf2);
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 52, r52));
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 53, r53));
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 54, r54));
  - platform: template
    name: "tuf3_set_clock"
    id: tuf3_set_clock
    entity_category: config
