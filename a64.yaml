# ADC Sensors

# ---------------------------------------------------------------------------
# 8-channel PT1000 RTD module on RS485 (Modbus RTU), 5 probes fitted.
#
# KC868-A64 RS485 transceiver is RX=GPIO13 / TX=GPIO14. Those were the only
# free pins that mattered -- 4,5,15,16 are the two i2c buses and 17,18,23 are
# the LAN8720.
#
# Register map was CONFIRMED ON THE HARDWARE, not assumed: a discovery build
# read three candidate layouts at once. Reads at 0x30 (FP32) and 0x68 (S_WORD,
# 0.1C) both returned the same value, while 0x00 returned an illegal-address
# error -- which also proves the module is answering and validating addresses.
# Word order is big-endian: FP32 gives -100.00 where FP32_R gives 0.00.
# Matches the ComWinTop CWT-TM-8PT map. Channels 1-8 are FP32 pairs at
# 0x30,0x32,0x34,0x36,0x38,0x3A,0x3C,0x3E.
#
# The FP32 block is used rather than the 0.1C integer block at 0x68 purely for
# resolution; both are live and either works.
# ---------------------------------------------------------------------------
uart:
  id: uart_rs485
  tx_pin: GPIO14
  rx_pin: GPIO13
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_rs485
  uart_id: uart_rs485

modbus_controller:
  - id: ptmod
    # Modbus ID 1 is CLAIMED by the CWT RTD module on this bus -- it is not just
    # "the default". Anything else added here must be given a different ID
    # BEFORE it is connected. The 4x TUF-2000M flow meters shipped defaulted to
    # ID 1 and collided with this module from 2026-09-27 to 2026-10-07: the
    # probes returned garbage (22164.8), then all-zeros (32F), then plausible
    # but frozen values. A power cycle, a firmware replacement and an ESPHome
    # upgrade all failed to fix it, because none of them could. The meters were
    # moved to IDs 2-5 on 2026-10-07 and the probes recovered immediately.
    # ID allocation on this bus: 1 = CWT-TM-8PT RTD, 2-5 = TUF-2000M flow.
    address: 1          # settable via register 0x10 hi byte
    modbus_id: modbus_rs485
    update_interval: 30s
    command_throttle: 200ms
    setup_priority: -10

# TUF-2000M ultrasonic flow meters, IDs 2-5 (see the ID-allocation note above).
#
# Addressing: the manual's worked example reads "REG0001 to REG0010" as
# `01 03 0000 000A`, so REG numbering is 1-based and wire address = REG - 1.
#   Flow Rate        REG0001-0002 -> address 0   REAL4, m3/h
#   Positive accum.  REG0009-0010 -> address 8   LONG
#   Temp #1 inlet    REG0033-0034 -> address 32  REAL4, C
#   Temp #2 outlet   REG0035-0036 -> address 34  REAL4, C
#
# The meters support ONLY function codes 3 and 6 (read registers / write a
# SINGLE register) -- there is no write-multiple, which is why setting their
# clock takes three separate FC6 writes.
#
# They also default to MODBUS-ASCII; ESPHome speaks RTU only, so each meter
# must have window M63 set to RTU or it will never answer here.
  - id: tuf2
    address: 2
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10
  - id: tuf3
    address: 3
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10
  - id: tuf4
    address: 4
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10
  - id: tuf5
    address: 5
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10

sensor:
  - platform: adc
    pin: 39
    name: "presence_sensor_bus_voltage"
    id: a64_analog_1
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 18
#
#  - platform: adc
#    pin: 34
#    name: "a64_analog_2"
