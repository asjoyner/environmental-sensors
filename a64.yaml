# Set each meter's RTC from the ESP32's SNTP clock (alfred, 10.0.32.1).
# The meters support only FC6 (write a SINGLE register), so this is three
# separate writes; the seconds field can therefore roll between them, which is
# fine for a clock that is only used to timestamp its own logs.
# Encoding per manual: 6 BCD bytes "SMHDMY, lower byte first" ->
#   reg52 = (minute<<8)|second   reg53 = (day<<8)|hour   reg54 = (year%100<<8)|month
# The month/year register is the one that is easy to get backwards: writing it
# as (month<<8)|year put 10-26-10 on the display instead of 26-10-10. Verified
# against the meter's own date window, which is why the raw calendar registers
# are exposed.
button:
  # One-shot: move the CWT-TM-8PT RTD module from Modbus ID 1 to 10 (ID plan).
  # Register 0x10 = (address << 8) | baud code. Refuses unless the module
  # answered on ID 1 with address byte 1, and keeps the baud byte. The
  # module is polled at 10 (ptmod) from this firmware on.
  - platform: template
    name: "rtd_move_to_id10"
    id: rtd_move_to_id10
    entity_category: config
    on_press:
      - lambda: |-
          float v = id(bus_id1_reg16).state;
          if (isnan(v)) {
            ESP_LOGW("bus", "rtd_move_to_id10: nothing read from ID 1 register 0x10 -- refusing");
            return;
          }
          uint16_t r = (uint16_t) v;
          if ((r >> 8) != 1) {
            ESP_LOGW("bus", "rtd_move_to_id10: register 0x10 = 0x%04X, address byte is not 1 -- refusing", r);
            return;
          }
          uint16_t w = (10 << 8) | (r & 0xFF);
          ESP_LOGI("bus", "rtd_move_to_id10: writing 0x%04X (was 0x%04X) to ID 1 register 0x10", w, r);
          auto *c = id(bus_id1);
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 0x10, w));
  # Commissions a SEN0601-style soil sensor: moves it from its factory ID 1 to
  # the ID in soil_next_id (20-39) by writing that ID to holding register
  # 0x07D0 (FC6). Refuses unless the last read of ID 1 register 0x07D0 returned
  # exactly 1, and register 0x10 does not look like the CWT RTD module (high
  # byte = its own address). Then add the sensor's line to `packages:` (one
  # soil_sensor.yaml include per ID) and flash. The sensor may need a power
  # cycle before it answers on the new ID.
  - platform: template
    name: "soil_move_id1_to_next_id"
    id: soil_move_id1_to_next_id
    entity_category: config
    on_press:
      - script.execute: soil_commission
  # Polls ID 1 now instead of waiting for its 15-min interval (read-only).
  - platform: template
    name: "soil_check_readback"
    id: soil_check_readback
    entity_category: config
    on_press:
      - script.execute: soil_check_script
  - platform: template
    name: "bus_id1_probe"
    id: bus_id1_probe
    entity_category: config
    on_press:
      - script.execute: bus_id1_probe_script
  - platform: template
    name: "tuf2_set_clock"
    id: tuf2_set_clock
    entity_category: config
    on_press:
      - script.execute: tuf2_set_clock_script
  - platform: template
    name: "tuf3_set_clock"
    id: tuf3_set_clock
    entity_category: config
    on_press:
      - script.execute: tuf3_set_clock_script
  - platform: template
    name: "tuf4_set_clock"
    id: tuf4_set_clock
    entity_category: config
    on_press:
      - script.execute: tuf4_set_clock_script
  - platform: template
    name: "tuf5_set_clock"
    id: tuf5_set_clock
    entity_category: config
    on_press:
      - script.execute: tuf5_set_clock_script


globals:
  - id: soil_verify_target
    type: int
    initial_value: "0"
  - id: soil_verify_sensor
    type: esphome::sensor::Sensor*
    initial_value: "nullptr"

script:
  # Polls the read-back controller for one soil ID once (soil_verify.yaml) and
  # waits up to 20 s for its address register. Result in soil_verify_sensor.
  - id: soil_verify_poll
    mode: single
    parameters:
      sid: int
    then:
      - lambda: |-
          esphome::modbus_controller::ModbusController *c = nullptr;
          esphome::sensor::Sensor *s = nullptr;
          switch (sid) {
            case 20: c = id(soilv20); s = id(soilv20_addr); break;
            case 21: c = id(soilv21); s = id(soilv21_addr); break;
            case 22: c = id(soilv22); s = id(soilv22_addr); break;
            case 23: c = id(soilv23); s = id(soilv23_addr); break;
            case 24: c = id(soilv24); s = id(soilv24_addr); break;
            case 25: c = id(soilv25); s = id(soilv25_addr); break;
            case 26: c = id(soilv26); s = id(soilv26_addr); break;
            case 27: c = id(soilv27); s = id(soilv27_addr); break;
            case 28: c = id(soilv28); s = id(soilv28_addr); break;
            case 29: c = id(soilv29); s = id(soilv29_addr); break;
            case 30: c = id(soilv30); s = id(soilv30_addr); break;
            case 31: c = id(soilv31); s = id(soilv31_addr); break;
            case 32: c = id(soilv32); s = id(soilv32_addr); break;
            case 33: c = id(soilv33); s = id(soilv33_addr); break;
            case 34: c = id(soilv34); s = id(soilv34_addr); break;
            case 35: c = id(soilv35); s = id(soilv35_addr); break;
            case 36: c = id(soilv36); s = id(soilv36_addr); break;
            case 37: c = id(soilv37); s = id(soilv37_addr); break;
            case 38: c = id(soilv38); s = id(soilv38_addr); break;
            case 39: c = id(soilv39); s = id(soilv39_addr); break;
            default: break;
          }
          id(soil_verify_sensor) = s;
          if (s != nullptr) {
            s->publish_state(NAN);
            c->update();
          }
      - wait_until:
          condition:
            lambda: 'return id(soil_verify_sensor) == nullptr || !isnan(id(soil_verify_sensor)->state);'
          timeout: 20s
  # Read-back check of any soil ID (soil_check_id) on demand: publishes the
  # address the sensor reports, or nothing if it does not answer. Read-only.
  - id: soil_check_script
    mode: single
    then:
      - script.execute:
          id: soil_verify_poll
          sid: !lambda 'return (int) id(soil_check_id).state;'
      - script.wait: soil_verify_poll
      - lambda: |-
          int sid = (int) id(soil_check_id).state;
          esphome::sensor::Sensor *s = id(soil_verify_sensor);
          float got = s == nullptr ? NAN : s->state;
          id(soil_verify_sensor) = nullptr;
          id(soil_check_result).publish_state(got);
          if (isnan(got)) ESP_LOGW("bus", "soil_check: no answer on ID %d", sid);
          else ESP_LOGI("bus", "soil_check: ID %d answers, address register = %d%s", sid, (int) got, (int) got == sid ? "" : " (MISMATCH)");
  # Fresh read of ID 1: clear the cached values first, so a stale reading from
  # the previous sensor can never be acted on, then poll and give the bus time.
  - id: bus_id1_probe_script
    mode: single
    then:
      - lambda: |-
          id(bus_id1_reg0).publish_state(NAN);
          id(bus_id1_reg16).publish_state(NAN);
          id(bus_id1_reg2000).publish_state(NAN);
      - component.update: bus_id1
      # Wait for the answer rather than a fixed time: the read can sit behind
      # other polls in the bus queue (each absent device costs ~2 s).
      - wait_until:
          condition:
            lambda: 'return !isnan(id(bus_id1_reg2000).state);'
          timeout: 20s
      - lambda: |-
          ESP_LOGI("bus", "bus_id1_probe: reg 0x07D0 = %f, reg 0x10 = %f",
                   id(bus_id1_reg2000).state, id(bus_id1_reg16).state);
  # Commissions one SEN0601-style soil sensor sitting on factory ID 1: probes ID
  # 1 now, refuses unless that fresh read of register 0x07D0 is exactly 1 and
  # register 0x10 does not look like the CWT RTD module, writes soil_next_id to
  # 0x07D0, then advances soil_next_id so the next sensor gets the next ID.
  # One new sensor on the bus at a time: two on ID 1 answer at once.
  - id: soil_commission
    mode: single
    then:
      - lambda: 'id(soil_verify_target) = 0;'
      - script.execute: bus_id1_probe_script
      - script.wait: bus_id1_probe_script
      - lambda: |-
          float a = id(bus_id1_reg2000).state;
          float r16 = id(bus_id1_reg16).state;
          int target = (int) id(soil_next_id).state;
          if (target < 20 || target > 39) {
            ESP_LOGW("bus", "soil_commission: soil_next_id %d outside 20-39 -- refusing", target);
            return;
          }
          if (isnan(a) || (uint16_t) a != 1) {
            ESP_LOGW("bus", "soil_commission: fresh read of ID 1 reg 0x07D0 = %f, expected 1 -- refusing (nothing new on ID 1?)", a);
            return;
          }
          if (!isnan(r16) && (((uint16_t) r16) >> 8) == 1) {
            ESP_LOGW("bus", "soil_commission: ID 1 reg 0x10 = 0x%04X looks like an RTD module -- refusing", (uint16_t) r16);
            return;
          }
          ESP_LOGI("bus", "soil_commission: writing %d to ID 1 register 0x07D0", target);
          auto *c = id(bus_id1);
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 0x07D0, (uint16_t) target));
          // Never reuse this reading; verify at the new ID before advancing.
          id(bus_id1_reg2000).publish_state(NAN);
          id(soil_verify_target) = target;
      - if:
          condition:
            lambda: 'return id(soil_verify_target) > 0;'
          then:
            - delay: 2s
            - script.execute:
                id: soil_verify_poll
                sid: !lambda 'return id(soil_verify_target);'
            - script.wait: soil_verify_poll
            - lambda: |-
                int target = id(soil_verify_target);
                esphome::sensor::Sensor *s = id(soil_verify_sensor);
                float got = s == nullptr ? NAN : s->state;
                id(soil_verify_target) = 0;
                id(soil_verify_sensor) = nullptr;
                if (isnan(got) || (int) got != target) {
                  ESP_LOGE("bus", "soil_commission: NOT verified: ID %d read back %f (no answer: the write may have failed, or the sensor needs a power cycle). soil_next_id stays %d", target, got, target);
                  return;
                }
                ESP_LOGI("bus", "soil_commission: verified: the sensor answers on ID %d", target);
                if (target < 39) {
                  auto call = id(soil_next_id).make_call();
                  call.set_value(target + 1);
                  call.perform();
                }
  - id: tuf2_set_clock_script
    mode: single
    then:
      # The three FC6 writes take ~2 s (600 ms turnaround each). Started late
      # in a minute, the meter can roll over between them (writing min=59,
      # then its own clock carries the hour, then we write the old hour = an
      # hour off). So only start in seconds 0-50.
      - wait_until:
          condition:
            lambda: 'auto t = id(sntp_time).now(); return t.is_valid() && t.second <= 50;'
          timeout: 70s
      - lambda: |-
            auto t = id(sntp_time).now();
            if (!t.is_valid()) {
              ESP_LOGW("tuf", "SNTP time not valid yet -- refusing to set meter clock");
              return;
            }
            auto bcd = [](int v) -> uint16_t { return ((v / 10) << 4) | (v % 10); };
            uint16_t r52 = (bcd(t.minute) << 8) | bcd(t.second);
            uint16_t r53 = (bcd(t.day_of_month) << 8) | bcd(t.hour);
            uint16_t r54 = (bcd(t.year % 100) << 8) | bcd(t.month);   // year HIGH, month LOW (verified on the display 2026-10-10)
            ESP_LOGI("tuf", "setting tuf2 clock to %04d-%02d-%02d %02d:%02d:%02d",
                     t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
            auto *c = id(tuf2);
            c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 52, r52));
            c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 53, r53));
            c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 54, r54));
      # Read the result back at once instead of waiting for the 15 min poll.
      - delay: 5s
      - component.update: tuf2_clk
