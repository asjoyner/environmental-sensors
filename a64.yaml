# Build with ESPHome 2026.9.1 (what built the firmware that ran from 10-10).
# 2025.10.2 (this repo's .venv, flash.sh's pin) produces firmware that boot-
# loops this board every ~40 s; that took the doors and DHW probes offline
# for 47 min on 2026-10-28. min_version makes an older ESPHome refuse.
#   ~/.cache/esphome-2026.9.1/bin/esphome run a64.yaml --device 10.0.32.107
esphome:
  name: door-switches
  friendly_name: Door Switches
  min_version: 2026.9.0
  includes:
    - tuf_clock.h

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# Clock, from alfred's chrony (allow 10.0.32.0/21, listening on :123).
# Added 2026-10-10 so the TUF-2000M flow meters can have their RTC set from a
# real time source -- they keep their own calendar in REG0053-0055.
time:
  - platform: sntp
    id: sntp_time
    timezone: America/New_York
    servers:
      - 10.0.32.1

prometheus:

# i2c configuration for both buses
i2c:
  - id: bus_a
    sda: 5
    scl: 16
    scan: true
    frequency: 400kHz
  - id: bus_b
    sda: 15
    scl: 4
    scan: true
    frequency: 400kHz
   
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0

# Configure the i2c i/o hubs
pcf8574:
  - id: 'pcf8574_hub_out_1'  # for output channel 1-16
    i2c_id: bus_a
    address: 0x24
    pcf8575: true

  - id: 'pcf8574_hub_out_2'  # for output channel 17-32
    i2c_id: bus_a
    address: 0x25
    pcf8575: true

  - id: 'pcf8574_hub_out_3'  # for output channel 33-48
    i2c_id: bus_a
    address: 0x21
    pcf8575: true

  - id: 'pcf8574_hub_out_4'  # for output channel 49-64
    i2c_id: bus_a
    address: 0x22
    pcf8575: true
   
  - id: 'pcf8574_hub_in_1'  # for a64_input channel 1-16
    i2c_id: bus_b
    address: 0x24
    pcf8575: true

  - id: 'pcf8574_hub_in_2'  # for a64_input channel 17-32
    i2c_id: bus_b
    address: 0x25
    pcf8575: true

  - id: 'pcf8574_hub_in_3'  # for a64_input channel 33-48
    i2c_id: bus_b
    address: 0x21
    pcf8575: true

  - id: 'pcf8574_hub_in_4'  # for a64_input channel 49-64
    i2c_id: bus_b
    address: 0x22
    pcf8575: true 
   
# Individual outputs
switch:
