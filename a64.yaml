# --- byte-order canary (temporary) -----------------------------------------
# REG0007-0008 is "Fluid sound speed" REAL4 in m/s. Water is ~1480-1550 m/s, so
# whichever of these two word orders lands in that band is the correct one for
# every REAL4 register on these meters. This also proves the meter is actually
# measuring the fluid rather than returning zeroed registers.
  - platform: modbus_controller
    modbus_controller_id: tuf2
    name: "tuf2_sound_fp32"
    id: tuf2_sound_fp32
    address: 6
    register_type: holding
    value_type: FP32
    unit_of_measurement: "m/s"
    accuracy_decimals: 1
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: tuf2
    name: "tuf2_sound_fp32r"
    id: tuf2_sound_fp32r
    address: 6
    register_type: holding
    value_type: FP32_R
    unit_of_measurement: "m/s"
    accuracy_decimals: 1
    entity_category: diagnostic

# --- meter self-diagnostics -------------------------------------------------
# REG0072 -> address 71. Error code bits, manual section 3.2:
#   1 signal lower | 2 poor signal | 3 pipe empty | 4 hardware | 9 clock/calendar
#   C temperature circuits | A parameter checksum | b software checksum
# Reading this tells us WHY a meter reports zero flow instead of guessing.
  - platform: modbus_controller
    modbus_controller_id: tuf2
    name: "tuf2_error_code"
    id: tuf2_error_code
    address: 71
    register_type: holding
    value_type: U_WORD
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: modbus_controller
    modbus_controller_id: tuf3
    name: "tuf3_error_code"
    id: tuf3_error_code
    address: 71
    register_type: holding
    value_type: U_WORD
