# --- TUF-2000M id 5: remote front-panel control -----------------------------
# The pipe parameters (M11 outer dia, M12 wall, M14 material, M15 material
# sound speed, M16 liner, M20 liquid, M23 transducer, M24 mounting) have NO
# writable MODBUS registers -- only "Inner pipe diameter" (REG0221) appears in
# the table and it is not flagged Writable. They can however be driven through
# the front panel remotely, because two registers ARE writable:
#   REG0060 -> addr 59  "Go to Window #"
#   REG0059 -> addr 58  "Key to input"
# Key values (manual 7.4): 0-9 = 48..57, '.' = 58, back = 59, MENU = 60,
# ENT = 61, UP/+ = 62, DOWN/- = 63.
# REG0257-0288 is the LCD buffer, so every step can be VERIFIED on the display
# instead of poked blind -- which matters because the option menus (M14/M16/
# M20/M23/M24) are scrolled with UP/DOWN from an unknown starting position.
text_sensor:
  - platform: modbus_controller
    modbus_controller_id: tuf5
    name: "tuf5_lcd"
    id: tuf5_lcd
    address: 256          # REG0257, 32 registers = 64 bytes of LCD buffer
    register_type: holding
    response_size: 64
    raw_encode: HEXBYTES
    entity_category: diagnostic

number:
  # Soil ID for soil_check_readback (read-only check of a commissioned sensor).
  - platform: template
    name: "soil_check_id"
    id: soil_check_id
    optimistic: true
    restore_value: true
    initial_value: 21
    min_value: 20
    max_value: 39
    step: 1
    mode: box
    entity_category: config
  # Target Modbus ID for soil_move_id1_to_next_id (soil range 20-39).
  - platform: template
    name: "soil_next_id"
    id: soil_next_id
    optimistic: true
    restore_value: true
    initial_value: 20
    min_value: 20
    max_value: 39
    step: 1
    mode: box
    entity_category: config
  - platform: modbus_controller
    modbus_controller_id: tuf5
    name: "tuf5_goto_window"
    id: tuf5_goto_window
    address: 59           # REG0060
    value_type: U_WORD
    min_value: 0
    max_value: 99
    step: 1
    entity_category: config
  - platform: modbus_controller
    modbus_controller_id: tuf5
    name: "tuf5_send_key"
    id: tuf5_send_key
    address: 58           # REG0059
    value_type: U_WORD
    min_value: 0
    max_value: 255
    step: 1
    entity_category: config
