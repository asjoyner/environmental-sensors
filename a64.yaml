  # plan at modbus_controller). Prometheus: ModbusId1Responding (ticket).
  - platform: template
    name: "modbus_id1_responding"
    id: modbus_id1_responding
    entity_category: diagnostic
  - platform: gpio
    name: "a64_input1"
