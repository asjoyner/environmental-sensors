# ADC Sensors

# ---------------------------------------------------------------------------
# 8-channel PT1000 RTD module on RS485 (Modbus RTU), 5 probes fitted.
#
# KC868-A64 RS485 transceiver is RX=GPIO13 / TX=GPIO14. Those were the only
# free pins that mattered -- 4,5,15,16 are the two i2c buses and 17,18,23 are
# the LAN8720.
#
# Register map was CONFIRMED ON THE HARDWARE, not assumed: a discovery build
# read three candidate layouts at once. Reads at 0x30 (FP32) and 0x68 (S_WORD,
# 0.1C) both returned the same value, while 0x00 returned an illegal-address
# error -- which also proves the module is answering and validating addresses.
# Word order is big-endian: FP32 gives -100.00 where FP32_R gives 0.00.
# Matches the ComWinTop CWT-TM-8PT map. Channels 1-8 are FP32 pairs at
# 0x30,0x32,0x34,0x36,0x38,0x3A,0x3C,0x3E.
#
# The FP32 block is used rather than the 0.1C integer block at 0x68 purely for
# resolution; both are live and either works.
# ---------------------------------------------------------------------------
uart:
  id: uart_rs485
  tx_pin: GPIO14
  rx_pin: GPIO13
  baud_rate: 9600
  data_bits: 8
  parity: NONE
  stop_bits: 1

modbus:
  id: modbus_rs485
  uart_id: uart_rs485

# Soil sensors: one line per commissioned, CONNECTED sensor (ID = its Modbus
# address, 20-39). Uncomment `packages:` with the first one, e.g.
# packages:
#   soil20: !include { file: soil_sensor.yaml, vars: { sid: "20" } }
# None for now (2026-11-17): soil20 is disconnected and the rest are not
# installed yet. An absent device costs a ~2 s Modbus timeout per poll, which
# delays every other device on the bus, so only list sensors that are wired.
#
# Read-back controllers for soil_commission (soil_verify.yaml): never polled on
# their own, so they cost nothing until a commission verifies one ID.
packages:
  soilv20: !include { file: soil_verify.yaml, vars: { sid: "20" } }
  soilv21: !include { file: soil_verify.yaml, vars: { sid: "21" } }
  soilv22: !include { file: soil_verify.yaml, vars: { sid: "22" } }
  soilv23: !include { file: soil_verify.yaml, vars: { sid: "23" } }
  soilv24: !include { file: soil_verify.yaml, vars: { sid: "24" } }
  soilv25: !include { file: soil_verify.yaml, vars: { sid: "25" } }
  soilv26: !include { file: soil_verify.yaml, vars: { sid: "26" } }
  soilv27: !include { file: soil_verify.yaml, vars: { sid: "27" } }
  soilv28: !include { file: soil_verify.yaml, vars: { sid: "28" } }
  soilv29: !include { file: soil_verify.yaml, vars: { sid: "29" } }
  soilv30: !include { file: soil_verify.yaml, vars: { sid: "30" } }
  soilv31: !include { file: soil_verify.yaml, vars: { sid: "31" } }
  soilv32: !include { file: soil_verify.yaml, vars: { sid: "32" } }
  soilv33: !include { file: soil_verify.yaml, vars: { sid: "33" } }
  soilv34: !include { file: soil_verify.yaml, vars: { sid: "34" } }
  soilv35: !include { file: soil_verify.yaml, vars: { sid: "35" } }
  soilv36: !include { file: soil_verify.yaml, vars: { sid: "36" } }
  soilv37: !include { file: soil_verify.yaml, vars: { sid: "37" } }
  soilv38: !include { file: soil_verify.yaml, vars: { sid: "38" } }
  soilv39: !include { file: soil_verify.yaml, vars: { sid: "39" } }

modbus_controller:
  - id: ptmod
    # ID ALLOCATION on this bus: see docs/systems/plumbing.md "RS485 bus ID plan".
    #   1 = never assigned: every device's factory default. Watched by bus_id1.
    #   2-9 flow meters (TUF-2000M 2-5) | 10-19 temperature modules (this one = 10)
    #   20-39 soil moisture | 40-239 future, one decade per device type
    #   240-247 temporary, for commissioning | 0, 248-255 not valid Modbus IDs
    # This module sat on ID 1 until 2026-10-28, so every new device that
    # arrived on its factory ID 1 collided with it. History: Anything else added here must be given a different ID
    # BEFORE it is connected. The 4x TUF-2000M flow meters shipped defaulted to
    # ID 1 and collided with this module from 2026-09-27 to 2026-10-07: the
    # probes returned garbage (22164.8), then all-zeros (32F), then plausible
    # but frozen values. A power cycle, a firmware replacement and an ESPHome
    # upgrade all failed to fix it, because none of them could. The meters were
    # moved to IDs 2-5 on 2026-10-07 and the probes recovered immediately.
    # The 2026-10-24 power cut reset meters 2-4 to ID 1 (no M26) and it happened again.
    address: 10         # register 0x10: high byte = address, low byte = baud code
    modbus_id: modbus_rs485
    update_interval: 30s
    command_throttle: 200ms
    setup_priority: -10

# TUF-2000M ultrasonic flow meters, IDs 2-5 (see the ID-allocation note above).
#
# Addressing: the manual's worked example reads "REG0001 to REG0010" as
# `01 03 0000 000A`, so REG numbering is 1-based and wire address = REG - 1.
#   Flow Rate        REG0001-0002 -> address 0   REAL4, m3/h
#   Positive accum.  REG0009-0010 -> address 8   LONG
#   Temp #1 inlet    REG0033-0034 -> address 32  REAL4, C
#   Temp #2 outlet   REG0035-0036 -> address 34  REAL4, C
#
# The meters support ONLY function codes 3 and 6 (read registers / write a
# SINGLE register) -- there is no write-multiple, which is why setting their
# clock takes three separate FC6 writes.
#
# They also default to MODBUS-ASCII; ESPHome speaks RTU only, so each meter
# must have window M63 set to RTU or it will never answer here.
  - id: tuf2
    address: 2
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10
  - id: tuf3
    address: 3
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10
  - id: tuf4
    address: 4
    modbus_id: modbus_rs485
    update_interval: 30s
    setup_priority: -10
  - id: tuf5
    address: 5
    modbus_id: modbus_rs485
    # Commissioning note: drop to 5s while driving this meter's front panel over
    # MODBUS -- the LCD buffer (REG0257) is the only feedback channel, and at 30s
    # a keystroke cannot be verified before the next is sent. That cost an
    # overwritten M11 value on 2026-10-10.
    update_interval: 30s
    setup_priority: -10

  # Slow pollers. ESPHome 2026.9 removed skip_updates; the replacement is a
  # second controller on the same address with a longer interval. A device
  # that does not answer costs a 2 s timeout (send_wait_time), so rarely
  # needed reads live here, not on the 30 s controllers (a 30 s cycle already
  # takes ~13.5 s of bus time, mostly the 600 ms turnaround per read).
  #
  # bus_id1: nothing should ever answer on ID 1. A response means someone
  # connected a device on its factory ID (TufMeter/soil sensor/etc.), or a
  # meter lost its settings. Feeds modbus_id1_responding and the
  # ModbusId1Responding ticket. Also how the RTD module was moved off ID 1
  # (rtd_move_to_id10 reads its register 0x10 through this controller).
  - id: bus_id1
    address: 1
    modbus_id: modbus_rs485
    update_interval: 15min
    setup_priority: -10
    on_offline:
      then:
        - lambda: |-
            id(bus_id1_reg0).publish_state(NAN);
            id(bus_id1_reg16).publish_state(NAN);
            id(modbus_id1_responding).publish_state(false);
            id(bus_id1_reg2000).publish_state(NAN);
  # Meter clocks, read every 15 min (tufN_clock_offset). The set-clock scripts
  # call component.update on these right after writing.
  - id: tuf2_clk
    address: 2
    modbus_id: modbus_rs485
    update_interval: 15min
    setup_priority: -10
  - id: tuf3_clk
    address: 3
    modbus_id: modbus_rs485
    update_interval: 15min
    setup_priority: -10
  - id: tuf4_clk
    address: 4
    modbus_id: modbus_rs485
    update_interval: 15min
    setup_priority: -10
  - id: tuf5_clk
    address: 5
    modbus_id: modbus_rs485
    update_interval: 15min
    setup_priority: -10

sensor:
  # Address reported by soil_check_id at the last soil_check_readback press
  # (empty = no answer). Diagnostic, published only by soil_check_script.
  - platform: template
    name: "soil_check_result"
    id: soil_check_result
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: never
  - platform: adc
    pin: 39
    name: "presence_sensor_bus_voltage"
    id: a64_analog_1
    update_interval: 10s
    attenuation: 12db
    filters:
      - multiply: 18
