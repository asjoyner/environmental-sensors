  - platform: modbus_controller
    modbus_controller_id: ptmod
    name: "pt1000_raw_ch1"
    id: pt1000_raw_ch1
    address: 0x30
    register_type: holding
    value_type: FP32
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    entity_category: diagnostic
    # Unfiltered on purpose: a channel with no probe shows -148F, which is the
