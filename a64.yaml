          uint16_t r54 = (bcd(t.month) << 8) | bcd(t.year % 100);
          ESP_LOGI("tuf", "setting tuf3 clock to %04d-%02d-%02d %02d:%02d:%02d",
                   t.year, t.month, t.day_of_month, t.hour, t.minute, t.second);
          auto *c = id(tuf3);
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 52, r52));
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 53, r53));
          c->queue_command(esphome::modbus_controller::ModbusCommandItem::create_write_single_command(c, 54, r54));
