# Read-back of one soil sensor ID, used only by soil_commission (a64.yaml) to
# confirm a freshly written address answers. Never polled on its own, so an
# absent sensor costs no bus time. One include per soil ID (20-39):
#   soilv20: !include { file: soil_verify.yaml, vars: { sid: "20" } }
modbus_controller:
  - id: soilv${sid}
    address: ${sid}
    modbus_id: modbus_rs485
    update_interval: never
    setup_priority: -10

sensor:
  - platform: modbus_controller
    modbus_controller_id: soilv${sid}
    id: soilv${sid}_addr
    internal: true
    address: 0x07D0
    register_type: holding
    value_type: U_WORD
