substitutions:
  node_name: "{{.Name}}"
  # A chip is considered stalled once this long has passed with no fresh
  # publish.  The scd4x publishes every 30s and the sht4x every 60s, so five
  # minutes is ~5 missed readings -- long enough to ride out a wifi hiccup,
  # short enough that a wedged chip is caught within one HVAC cycle.
  stall_timeout_ms: "300000"
  # How many reboots we are willing to spend on one chip before we stop and
  # let the alerting take over.  A physically dead sensor must not put the
  # node into a reboot loop.
  reboot_budget: "3"

esphome:
  name: "${node_name}"
  on_boot:
    # The STEMMA QT rail is switched by GPIO2.  Both chips initialise at
    # setup_priority DATA (600) and a failed init is permanent -- ESPHome calls
    # mark_failed() and never retries the component.
    #
    # SHT4XComponent::setup() probes the bus synchronously, right there at 600,
    # so it has zero tolerance for the rail coming up late.  SCD4XComponent
    # defers its first transaction by set_timeout(1000, ...), which is why the
    # sht4x is the chip that historically lost this race -- ten of them died in
    # one event on 2026-07-23 while every scd4x on those same nodes survived.
    #
    # The switch below carries setup_priority 1100, so by the time this runs
    # the rail is already powered.  Driving it high is not enough on its own:
    # an OTA or a watchdog reboot is a *soft* reset that never interrupts the
    # STEMMA supply, so a chip that was mid-transaction stays mid-transaction
    # and can hold SDA low across the reboot.  Observed on the first
    # post-OTA boot of master-bedroom on 2026-08-07: the scd4x came up failed
    # and the bus needed "Recovery: bus successfully recovered".
    #
    # So cut the rail and bring it back, giving both chips a real power-on
    # reset.  At priority 1050 this lands after the switch (1100) but before
    # the i2c bus initialises and scans (BUS, 1000), so the scan sees freshly
    # reset chips and the sensors at DATA (600) are far downstream.
    #
    # These must be blocking delays, not `delay:` actions -- `delay:` yields
    # back to the setup loop, which is exactly the race we are closing.
    - priority: 1050
      then:
        - lambda: |-
            id(i2c_power).turn_off();
            delay(500);    // let the rail discharge so the chips really reset
            id(i2c_power).turn_on();
            delay(1200);   // scd4x needs ~1s after power-up before it answers

esp32:
  board: adafruit_feather_esp32_v2
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "{{.Secrets.EspAPIKey}}"

ota:
  - platform: esphome
    password: "{{.Secrets.OtaPassword}}"

wifi:
  ssid: "{{.Secrets.WifiSSID}}"
  password: "{{.Secrets.WifiPassword}}"
  fast_connect: true

i2c:
  sda: SDA
  scl: SCL
  scan: true
  id: bus_a

web_server:
  port: 80

# Exposes /metrics on port 80 so Prometheus can scrape the node directly,
# without Home Assistant in the path.  This is what gives us
# esphome_sensor_failed -- the only signal that distinguishes "chip failed to
# initialise" from "node is offline".
prometheus:

# Reset reason and heap, for diagnosing the mass-reboot events that take out a
# batch of chips at once.
debug:
  update_interval: 60s

# Power enable for STEMMA QT
output:
  - platform: gpio
    pin:
      number: 2   # GPIO 2 for Feather ESP32 v2
      inverted: false
    id: i2c_power_out
    setup_priority: 1100

switch:
  - platform: output
    name: "STEMMA I2C Power"
    output: i2c_power_out
    id: i2c_power
    # With no restore_mode this resolves to ALWAYS_OFF, so the old firmware
    # unconditionally drove the rail low on every boot and left an on_boot
    # automation at priority 600 to race the sensors for it.
    restore_mode: ALWAYS_ON
    setup_priority: 1100

globals:
  # millis() of the last publish from each chip.  Zero at boot, which makes the
  # first stall check fall due at stall_timeout_ms of uptime -- that doubles as
  # the post-boot grace period.
  - id: last_scd_ok
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: last_sht_ok
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # 0 = healthy, 1 = rail power-cycled and waiting, 3 = gave up
  - id: recovery_stage
    type: int
    restore_value: false
    initial_value: '0'
  - id: stage_since
    type: uint32_t
    restore_value: false
    initial_value: '0'
  # Lifetime counters.  restore_value writes flash, so these are only touched
  # on an actual recovery event, never on the 30s tick.
  - id: power_cycles_total
    type: int
    restore_value: true
    initial_value: '0'
  - id: reboots_total
    type: int
    restore_value: true
    initial_value: '0'
  - id: consec_reboots
    type: int
    restore_value: true
    initial_value: '0'
  - id: giveups_total
    type: int
    restore_value: true
    initial_value: '0'

sensor:
{{if .NoCO2}}  # This node was built without an SCD4x fitted -- an i2c bus scan finds only
  # 0x44 (SHT4x), no 0x62. Declaring the sensor anyway would mark it failed on
  # every boot, alert forever, and make the watchdog spend its entire reboot
  # budget hunting hardware that was never installed.
{{else}}  - platform: scd4x
    co2:
      name: "scd4x CO2"
      id: scd_co2
      on_value:
        then:
          - lambda: 'id(last_scd_ok) = millis();'
    temperature:
      name: "scd4x Temperature"
    humidity:
      name: "scd4x Humidity"
    update_interval: 30s
{{end}}

  - platform: sht4x
    temperature:
      name: "sht4x Temperature"
      id: sht_temp
      on_value:
        then:
          - lambda: 'id(last_sht_ok) = millis();'
    humidity:
      name: "sht4x Relative Humidity"

  # --- diagnostics, scraped straight off /metrics -------------------------
  - platform: uptime
    name: "Uptime"
    id: node_uptime
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: debug
    free:
      name: "Heap Free"

{{if not .NoCO2}}  - platform: template
    name: "scd4x Seconds Since Reading"
    id: scd_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (millis() - id(last_scd_ok)) / 1000.0f;'
{{end}}

  - platform: template
    name: "sht4x Seconds Since Reading"
    id: sht_age
    unit_of_measurement: "s"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: 'return (millis() - id(last_sht_ok)) / 1000.0f;'

  - platform: template
    name: "I2C Power Cycles"
    unit_of_measurement: ""
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(power_cycles_total);'

  - platform: template
    name: "Recovery Reboots"
    unit_of_measurement: ""
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(reboots_total);'

  - platform: template
    name: "Recovery Giveups"
    unit_of_measurement: ""
    accuracy_decimals: 0
    update_interval: 60s
    lambda: 'return id(giveups_total);'

binary_sensor:
  # Latches high when the watchdog has spent its whole reboot budget and the
  # chip is still dead.  This is the "automatic recovery did not work, come
  # look at me" signal.
  - platform: template
    name: "Sensor Recovery Failed"
    lambda: 'return id(recovery_stage) == 3;'

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset Reason"

button:
  # Remote reboot lever.  Without this the only way to restart a wedged node
  # was an OTA push or a trip to the outlet.
  - platform: restart
    name: "Restart"

interval:
  - interval: 30s
    then:
      - lambda: |-
          const uint32_t now = millis();
          const uint32_t stall = ${stall_timeout_ms};
          // Only chips this node actually has are allowed to trigger recovery.
          const bool stalled = {{if not .NoCO2}}(now - id(last_scd_ok) > stall) ||
                               {{end}}(now - id(last_sht_ok) > stall);

          if (!stalled) {
            if (id(recovery_stage) != 0 && id(recovery_stage) != 3) {
              ESP_LOGI("envwd", "sensors reporting again; recovery complete");
              id(recovery_stage) = 0;
              id(stage_since) = now;
            }
            // Half an hour of clean running earns the reboot budget back, so a
            // node that really did recover can heal itself again next time.
            if (now > 1800000 && id(consec_reboots) != 0) {
              id(consec_reboots) = 0;
            }
            return;
          }

          switch (id(recovery_stage)) {
            case 0:
              // Cheapest fix first: bounce the STEMMA rail.  This recovers a
              // chip that is wedged at runtime but whose ESPHome component is
              // still alive and polling.
              ESP_LOGW("envwd", "sensor stall detected; power-cycling STEMMA rail");
              id(power_cycles_total) += 1;
              id(i2c_power).turn_off();
              delay(500);
              id(i2c_power).turn_on();
              id(recovery_stage) = 1;
              id(stage_since) = now;
              break;

            case 1:
              // Give the rail bounce a full stall window to take effect.
              if (now - id(stage_since) < stall) break;
              // It did not.  The component is almost certainly mark_failed(),
              // which only a fresh setup() can clear -- i.e. a reboot.
              if (id(consec_reboots) >= ${reboot_budget}) {
                ESP_LOGE("envwd", "reboot budget spent and sensor still dead; giving up");
                id(giveups_total) += 1;
                id(recovery_stage) = 3;
                break;
              }
              id(reboots_total) += 1;
              id(consec_reboots) += 1;
              ESP_LOGE("envwd", "rebooting to re-init i2c sensors (attempt %d)",
                       id(consec_reboots));
              App.safe_reboot();
              break;

            default:
              // Stage 3: stay up and keep serving /metrics so the alert fires
              // and the node can still be power-cycled or rebooted remotely.
              break;
          }

font:
  - file: "gfonts://Roboto"
    id: roboto
    size: 20

light:
  - platform: esp32_rmt_led_strip  # New component
    pin: 0
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812
    use_psram: false
    name: "NeoPixel"
    id: "neopixel"
    initial_state:
      state: false
      red: 0.0
      green: 0.1
      blue: 0.0

  - platform: status_led
    name: "Status Light"
    pin: GPIO13
    initial_state:
      state: true
